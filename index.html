<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PoliAule</title>
  <meta name="description" content="A website to find available classrooms around Politecnico di Milano" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="theme-color" content="#ECECEC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1E1E" media="(prefers-color-scheme: dark)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicons/main/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicons/main/favicon.svg" />
  <link rel="shortcut icon" href="/favicons/main/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/main/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="PoliAule" />
  <link rel="manifest" href="/favicons/main/site.webmanifest" />

  <!-- Preload the logo to improve loading times -->
  <link rel="preload" as="image" href="/favicons/main/logo.png">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="./components/date-picker.css" />
  <link rel="stylesheet" href="./components/date-chip-picker.css" />
  <link rel="stylesheet" href="./components/data-fetch-card.css" />
  <link rel="stylesheet" href="./components/time-picker.css" />
  <link rel="stylesheet" href="./components/time-range-slider.css" />
  <link rel="stylesheet" href="./components/time-range-chip-picker.css" />
  <link rel="stylesheet" href="./components/classroom-list.css" />
  <link rel="stylesheet" href="./components/building-overview.css" />
  <link rel="stylesheet" href="./components/settings.css" />
  <link rel="stylesheet" href="./components/search-overlay.css" />
  <link rel="stylesheet" href="./components/classroom-detail.css" />
  <link rel="stylesheet" href="./components/info-page.css" />
  <link rel="stylesheet" href="./components/bottom-nav.css" />
  <link rel="stylesheet" href="./components/favourites.css" />
  <link rel="stylesheet" href="./components/liquid-glass.css" />
  <link rel="stylesheet" href="./components/keybindings.css" />

  <!-- Nunito font -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- HugeIcons (stroke-rounded) — used for the redesigned bottom nav, and going forward -->
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />

  <!-- JS -->
  <script type="module" src="script.js" defer></script>
  <script type="module" src="available-rooms-script.js" defer></script>
  <script type="module" src="./components/popover.js" defer></script>
  <script type="module" src="./components/haptics.js" defer></script>
  <script type="module" src="./components/classroom-list.js" defer></script>
  <script type="module" src="./components/building-overview.js" defer></script>
  <script type="module" src="./components/bottom-nav.js" defer></script>

</head>

<body>
  <!-- Splash Screen -->
  <div id="splash-overlay" class="splash-overlay" aria-hidden="true">
    <img src="/favicons/main/logo.png" class="splash-logo" alt="" draggable="false" />
    <span class="splash-loading-label">Loading</span>
  </div>

  <!-- NoScript Overlay (clients with JS disabled) -->
  <noscript>
    <div class="noscript-overlay">
      <p>PoliAule requires JavaScript to work. Please enable it in your browser settings.</p>
    </div>
  </noscript>

  <!-- Header -->
  <div class="header-top-strip" aria-hidden="true"></div>
  <header class="header">
    <div class="header-top-line-container">
      <div class="header-blur-layers" aria-hidden="true">
        <div class="header-blur-layer"></div>
        <div class="header-blur-layer"></div>
        <div class="header-blur-layer"></div>
        <div class="header-blur-layer"></div>
        <div class="header-fade-overlay"></div>
      </div>

      <div class="header-title-container">
        <button class="header-title-btn" id="info-trigger" aria-label="About PoliAule">
          <img src="/favicons/main/logo.png" class="header-logo">

          <div class="header-title-beta-container splash-header-item">
            <h2 class="header-title">PoliAule</h2>
            <h4 class="secondary" id="env-badge" hidden>Beta</h4>
          </div>
        </button>
      </div>

      <div class="header-buttons-container splash-header-item">

        <!-- Favourite toggle (only shown on the classroom detail page).
             Content is swapped between the hgi-star outline and a filled star
             by classroomDetail._syncFavBtn(). -->
        <button id="favourite-btn" class="header-button liquid-glass" hidden aria-label="Add to favourites">
          <i class="hgi-stroke hgi-star" aria-hidden="true"></i>
        </button>

        <!-- Data Fetch Indicator — the button morphs into a glass card holding
             the freshness status + reload button (see components/data-fetch-card.js). -->
        <button id="data-fetch-btn" class="header-button liquid-glass" aria-label="Data status">
          <div id="data-fetch-indicator" class="pulse-indicator"></div>
        </button>

        <!-- Settings button -->
        <button id="settings-btn" class="header-button liquid-glass" aria-label="Settings">
          <span class="material-symbols-outlined">settings</span>
        </button>

      </div>


    </div>

    <!-- Reserves the 3.5rem nav-row band in the header layout (see
         .header-nav-row); the back button itself is a sibling of <header>
         below, not a child, so Safari never bakes it into the
         ::view-transition-old(app-header) snapshot (it doesn't subtract
         descendants with their own view-transition-name), which left a
         frozen ghost of the button during the close transition. -->
    <div class="header-nav-row"></div>

  </header>

  <button id="detail-back-btn" class="detail-back-btn liquid-glass" hidden>
    <span class="material-symbols-outlined">chevron_left</span>
    <span class="detail-back-label" data-i18n="search.back">Back</span>
  </button>


  <!-- Rest of the UI under the header -->
  <div class="body-container">

    <!-- Available Classrooms -->
    <div id="available-classrooms-container" class="tab-content visible">

      <!-- Favourite Classrooms -->
      <div class="favourites-section">
        <div class="section-header">
          <h3 class="section-header-title"><i class="hgi-stroke hgi-star section-header-title-icon"
              aria-hidden="true"></i><span data-i18n="favourites.title">Favourites</span></h3>
        </div>
        <div id="favourites-carousel" class="favourites-carousel" hidden></div>
        <p id="favourites-empty" class="favourites-empty secondary" data-i18n="favourites.empty">Star a classroom to pin
          it here.</p>
      </div>

      <div class="section-header">
        <h3 class="section-header-title"><i class="hgi-stroke hgi-calendar-03 section-header-title-icon"
            aria-hidden="true"></i><span data-i18n="available.title">Available Classrooms</span></h3>
      </div>

      <form id="available-classrooms-form" class="form" data-loading>

        <!-- Campus + Date pills, side by side (wrap on narrow screens) -->
        <div class="picker-row">
          <!-- Campus Picker -->
          <campus-chip-picker data-loading>
            <input type="hidden" id="campus-picker" name="campus" />
          </campus-chip-picker>

          <!-- Date + Time share a sub-container so that, when they're docked as
               inline panels on desktop, they stack together beside the campus
               list instead of each wrapping to its own full-width row. On mobile
               this wrapper is display:contents (see style.css) so nothing
               changes. -->
          <div class="picker-substack">
            <!-- Date picker — compact glass pill that morphs into a popup holding
                 the sliding picker below (see components/date-chip-picker.js). -->
            <date-chip-picker data-loading>
              <div class="date-picker">
                <select id="date-picker" name="date" hidden></select>

                <div id="today-indicator" class="hidden" aria-hidden="true" data-i18n="datepicker.today">Today</div>
                <div class="date-picker-container"></div>
                <div class="date-indicator"></div>
              </div>
            </date-chip-picker>

            <!-- Time range picker — compact glass pill that morphs into a popup
                 holding the drag-based slider (see components/time-range-chip-picker.js). -->
            <time-range-chip-picker data-loading>
              <div class="time-pickers-container">
                <!-- From time picker -->
                <div class="time-picker">
                  <input type="time" id="from-time-picker" name="from" min="07:15" max="20:15" />
                </div>

                <!-- To time picker -->
                <div class="time-picker">
                  <input type="time" id="to-time-picker" name="to" min="07:15" max="20:15" />
                </div>
              </div>
            </time-range-chip-picker>
          </div>
        </div>
      </form>

      <div id="available-classrooms-results" class="available-classrooms-container empty">
        <span class="material-symbols-outlined empty-container-icon">search</span>
        <p class="empty-container-title" data-i18n="results.emptyTitle">Need a classroom?</p>
        <p class="empty-container-subtitle" data-i18n="results.emptySubtitle">Tell me when you need it and I’ll show you
          what’s available</p>
      </div>

    </div>

    <!-- Campus (new UI — TBD). Kept as an empty tab panel so the bottom-nav
         Available/Campus pill still has a target; content to be rebuilt. -->
    <div id="search-classrooms-container" class="tab-content"></div>

    <!-- Classroom Detail Panel (sibling to tab-content divs, shown in-place) -->
    <div id="classroom-detail-overlay" hidden></div>

    <!-- Info Page Panel (sibling to tab-content divs, shown in-place) -->
    <div id="info-page-overlay" hidden></div>

  </div>

  <footer class="footer">
    <button class="transparent-button version-info-button" data-popover="version-info-popover">
      <label class="secondary" data-i18n="footer.versionInfo"></label>
    </button>
    <div id="version-info-popover" class="popover liquid-glass">
      <div class="arrow" data-arrow></div>

      <img src="/favicons/main/logo.png" class="changelog-logo" />
      <h1 class="popover-title" data-i18n="footer.versionInfo"></h1>
      <div class="changelog-container">
        <h2 class="popover-subtitle" data-i18n="footer.whatsNew">What's new?</h2>

        <ul>
          <li data-i18n="changelog.item1"></li>
          <li data-i18n="changelog.item2"></li>
          <li data-i18n="changelog.item3"></li>
          <li data-i18n="changelog.item4"></li>
          <li data-i18n="changelog.item5"></li>
        </ul>

        <a href="https://github.com/SummaCristian/poliaule" target="_blank" class="hero-badge">
          <svg class="hero-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 0.297c-6.627 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.387 
                0.6 0.113 0.82-0.26 0.82-0.577 0-0.285-0.01-1.04-0.015-2.04 
                -3.338 0.724-4.042-1.61-4.042-1.61-0.546-1.387-1.333-1.756-1.333-1.756 
                -1.09-0.745 0.083-0.729 0.083-0.729 1.205 0.084 1.838 1.237 1.838 1.237 
                1.07 1.834 2.807 1.304 3.492 0.997 0.108-0.775 0.418-1.304 0.762-1.604 
                -2.665-0.303-5.467-1.334-5.467-5.932 0-1.31 0.468-2.38 1.236-3.22 
                -0.124-0.303-0.536-1.523 0.117-3.176 0 0 1.008-0.322 3.3 1.23 
                0.957-0.266 1.983-0.399 3.003-0.404 1.02 0.005 2.047 0.138 3.006 0.404 
                2.289-1.552 3.295-1.23 3.295-1.23 0.655 1.653 0.243 2.873 0.12 3.176 
                0.77 0.84 1.235 1.91 1.235 3.22 0 4.61-2.807 5.625-5.48 5.921 
                0.43 0.37 0.823 1.096 0.823 2.21 0 1.595-0.015 2.877-0.015 3.267 
                0 0.32 0.216 0.694 0.825 0.576C20.565 22.092 24 17.592 24 12.297 
                24 5.67 18.627 0.297 12 0.297z" />
          </svg>
          <span class="hero-text" data-i18n="footer.checkOnGitHub">Check on GitHub</span>
        </a>

      </div>
    </div>

    <label class="secondary info-label">
      <strong><span data-i18n="footer.disclaimer5">Not affiliated with Politecnico di Milano.</span></strong>
    </label>
  </footer>

  <!-- Data-fetch status card. data-fetch-card.js relocates this container into a
       morphing card shell that grows from the header button. -->
  <div id="data-fetch-indicator-popover-container" class="data-fetch-popover-container"></div>

  <!-- Search overlay (opened by the bottom-nav search FAB; floats over the current tab) -->
  <div id="search-overlay" class="search-overlay-backdrop" hidden>
    <div class="search-overlay-panel" role="dialog" aria-modal="true" aria-label="Search classrooms">
      <div class="search-overlay-header">
        <div class="search-bar-wrapper liquid-glass">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="classroom-search-input" class="search-input"
            data-i18n-attr="placeholder:search.inputPlaceholder" placeholder="e.g. 2.0.1, Trifoglio..."
            autocomplete="off" spellcheck="false" />
          <button id="classroom-search-clear" class="search-clear-btn" type="button" tabindex="-1"
            aria-label="Clear search">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <button id="search-overlay-close" class="search-overlay-close liquid-glass" type="button"
          aria-label="Close search">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div id="search-overlay-results" class="search-overlay-results"></div>
    </div>
  </div>

  <!-- Bottom pill nav (populated by components/bottom-nav.js) -->
  <div class="bn-wrapper" id="bn-wrapper">
    <div class="bn-group" id="bn-group">
      <nav class="bn-tabbar" id="bn-bar" aria-label="Main navigation">
        <div class="bn-tabbar-items" id="bn-bar-items"></div>
      </nav>
      <div class="bn-pill-outer" id="bn-pill" aria-hidden="true">
        <div class="bn-pill-inner">
          <div class="bn-active-row" id="bn-active-row"></div>
        </div>
      </div>
      <div class="bn-pill-hit" id="bn-pill-hit"></div>
    </div>

    <button class="bn-search-btn liquid-glass" id="bn-search-btn" type="button" aria-label="Search">
      <span class="bn-search-btn-inner">
        <i class="hgi-stroke hgi-search-01"></i>
        <span class="bn-tab-label" data-i18n="tabs.search">Search</span>
      </span>
    </button>
  </div>

</body>

</html>
